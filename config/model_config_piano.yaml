# Model configuration for Baby Grand Piano training
# Single instrument, optimized for piano sounds

diffusion:
  num_timesteps: 1000
  beta_schedule: "cosine"
  latent_channels: 64  # Stable Audio VAE
  condition_dim: 256
  time_embed_dim: 256
  prediction_type: "epsilon"  # Standard epsilon prediction
  timestep_weighting: false  # Uniform sampling (can enable later if needed)
  timestep_weight_min: 200
  timestep_weight_max: 800

# Stable Audio VAE settings
stable_audio_vae:
  model_path: "stabilityai/stable-audio-open-1.0"
  latent_channels: 64
  latent_rate: 21.5  # Hz

audio:
  sample_rate: 44100
  duration: 4.0
  n_mels: 128
  n_fft: 2048
  hop_length: 512
