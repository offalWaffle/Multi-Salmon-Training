# GPU-Optimized Training Configuration
# For NVIDIA GPUs with CUDA support

training:
  batch_size: 32  # Increased for GPU (A100 can handle 64-128)
  num_epochs: 100
  learning_rate: 2.0e-4  # Slightly higher for larger batch size
  num_workers: 8  # More workers for GPU data loading
  gradient_accumulation_steps: 1  # Not needed with larger batch size

  optimizer: "AdamW"
  scheduler: "cosine"
  warmup_steps: 2000

  checkpoint_interval: 5
  validation_interval: 1

device: "cuda"
mixed_precision: true  # Enable FP16 mixed precision for speed

# Data loading optimizations
data:
  train_split: 0.9
  val_split: 0.1
  random_seed: 42
  pin_memory: true
  persistent_workers: true

# Performance settings
performance:
  compile_model: false  # Set to true for PyTorch 2.0+ (extra speedup)
  torch_compile_mode: "default"  # "default", "reduce-overhead", or "max-autotune"
  cudnn_benchmark: true  # Auto-tune CUDA kernels
  tf32: true  # Use TensorFloat-32 on Ampere GPUs (A100, RTX 30xx+)
