# GPU-Optimized Model Configuration
# Same as base config, but with notes for GPU optimization

vae:
  in_channels: 1
  latent_dim: 128
  encoder_channels: [64, 128, 256, 512]
  decoder_channels: [512, 256, 128, 64]

diffusion:
  num_timesteps: 1000
  beta_schedule: "cosine"
  latent_channels: 128
  condition_dim: 256
  time_embed_dim: 256

  # Optional: reduce timesteps for faster sampling during validation
  # num_inference_steps: 50  # DDIM sampling steps

unet:
  # Can increase model size on GPU if needed
  model_channels: 256  # 256 or 384 for larger models
  num_res_blocks: 2
  channel_mult: [1, 2, 3, 4]
  attention_resolutions: [2, 4]
  dropout: 0.1

input_encoder:
  embed_dim: 128
  aggregation: "attention"  # "attention" or "mean"
  num_heads: 4

audio:
  sample_rate: 44100
  duration: 4.0
  n_mels: 128
  n_fft: 2048
  hop_length: 512
