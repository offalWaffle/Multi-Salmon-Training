training:
  batch_size: 16  # Adjusted for Apple Silicon memory
  num_epochs: 200  # Start with 200 epochs
  learning_rate: 1e-4
  num_workers: 4

  gradient_accumulation_steps: 4  # Effective batch size 64

  optimizer: "AdamW"
  scheduler: "cosine"
  warmup_steps: 1000

  checkpoint_interval: 25
  validation_interval: 1

  # Unconditional training mode
  unconditional: false

  # Classifier-Free Guidance (CFG) training
  # INCREASED from 0.1 to 0.5 to force model to learn conditioning
  cfg_dropout_prob: 0.5

  # CFG guidance scale for sampling
  cfg_guidance_scale: 3.0

  # Pitch Augmentation (NEW!)
  # This forces the model to learn that MIDI controls pitch
  pitch_augmentation:
    enabled: true
    prob: 0.5  # 50% of samples get pitch-shifted
    max_shift_semitones: 6  # ±6 semitones (half octave)

device: "mps"  # Metal Performance Shaders for Apple Silicon
mixed_precision: false  # MPS has limited FP16 support currently

data:
  train_split: 0.9
  val_split: 0.1
  random_seed: 42
