training:
  batch_size: 16
  num_epochs: 300  # Train longer
  learning_rate: 0.0001  # Higher learning rate
  num_workers: 0
  gradient_accumulation_steps: 1

  optimizer: "AdamW"
  weight_decay: 0.0001  # Much lower weight decay
  scheduler: "cosine"
  warmup_steps: 100

  # VAE specific - MUCH more conservative
  beta: 0.00001  # Start VERY low
  beta_annealing: true
  beta_final: 0.1  # Much lower final beta (was 4.0)
  beta_annealing_epochs: 200  # Slower annealing

  # NO free bits - let model learn naturally
  free_bits: 0.0

  checkpoint_interval: 10
  validation_interval: 5

  # Add reconstruction quality focus
  use_l1_loss: true  # L1 can be better than MSE for audio
  reconstruction_weight: 1.0

device: "mps"
mixed_precision: false
