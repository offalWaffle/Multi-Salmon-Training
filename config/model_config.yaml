vae:
  in_channels: 1
  latent_dim: 128
  encoder_channels: [64, 128, 256, 512]
  decoder_channels: [512, 256, 128, 64]

diffusion:
  num_timesteps: 1000
  beta_schedule: "cosine"
  latent_channels: 64  # Stable Audio VAE latent channels (was 128 for DAC)
  condition_dim: 256  # For MIDI note + velocity + instrument embedding
  time_embed_dim: 256
  prediction_type: "epsilon"  # Standard epsilon prediction
  timestep_weighting: false  # Uniform timestep sampling
  timestep_weight_min: 200
  timestep_weight_max: 800

# Stable Audio VAE settings
stable_audio_vae:
  model_path: "stabilityai/stable-audio-open-1.0"
  latent_channels: 64
  latent_rate: 21.5  # Hz

audio:
  sample_rate: 44100
  duration: 4.0
  n_mels: 128
  n_fft: 2048
  hop_length: 512
